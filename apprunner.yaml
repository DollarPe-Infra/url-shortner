version: 1.0
runtime: nodejs22

build:
  commands:
    build:
      - npm ci --omit=dev

run:
  runtime-version: "22.21.1"
  # run migrate inside the start command so it shares the runtime secrets (DB_*).
  # pre-run does not reliably receive the injected secrets, so it migrated the
  # sqlite default instead of Postgres. migrate:latest is idempotent.
  command: sh startup.sh
  network:
    port: 3000

  # Instance role required for retrieving secrets from Secrets Manager
  # instanceRoleArn: arn:aws:iam::291935881411:role/AppRunnerInstanceRole

  env:
    - name: SITE_NAME
      value: Proremit
    - name: SITE_DESCRIPTION
      value: Secure link shortening for Proremit
    - name: PORT
      value: "3000"

  secrets:
    - name: NODE_ENV
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:NODE_ENV::"
    - name: DEFAULT_DOMAIN
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:DEFAULT_DOMAIN::"
    - name: TRUST_PROXY
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:TRUST_PROXY::"
    - name: DB_CLIENT
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:DB_CLIENT::"
    - name: DB_HOST
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:DB_HOST::"
    - name: DB_PORT
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:DB_PORT::"
    - name: DB_NAME
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:DB_NAME::"
    - name: DB_USER
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:DB_USER::"
    - name: DB_PASSWORD
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:DB_PASSWORD::"
    - name: DB_SSL
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:DB_SSL::"
    - name: DB_POOL_MIN
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:DB_POOL_MIN::"
    - name: DB_POOL_MAX
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:DB_POOL_MAX::"
    - name: REDIS_ENABLED
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:REDIS_ENABLED::"
    - name: REDIS_HOST
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:REDIS_HOST::"
    - name: REDIS_PORT
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:REDIS_PORT::"
    - name: REDIS_PASSWORD
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:REDIS_PASSWORD::"
    - name: REDIS_DB
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:REDIS_DB::"
    - name: LINK_LENGTH
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:LINK_LENGTH::"
    - name: DISALLOW_REGISTRATION
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:DISALLOW_REGISTRATION::"
    - name: DISALLOW_ANONYMOUS_LINKS
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:DISALLOW_ANONYMOUS_LINKS::"
    - name: CUSTOM_DOMAIN_USE_HTTPS
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:CUSTOM_DOMAIN_USE_HTTPS::"
    - name: JWT_SECRET
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:JWT_SECRET::"
    - name: ADMIN_EMAIL
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:ADMIN_EMAIL::"
    - name: ADMIN_PASSWORD
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:ADMIN_PASSWORD::"
    - name: LINK_CUSTOM_ALPHABET
      value-from: "arn:aws:secretsmanager:us-east-1:515966498240:secret:production/url_shortner-WGx9sc:LINK_CUSTOM_ALPHABET::"
